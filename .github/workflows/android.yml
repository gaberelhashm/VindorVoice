name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build and verify installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew clean assembleRelease --no-daemon --stacktrace

      - name: Locate unsigned APK
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/release \
            -maxdepth 1 \
            -type f \
            -name "*unsigned.apk" \
            -print -quit)"

          if [ -z "$APK" ]; then
            echo "Unsigned APK was not found."
            find app/build/outputs -type f -name "*.apk" -print || true
            exit 1
          fi

          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"
          echo "Found APK: $APK"

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          KEYSTORE="$RUNNER_TEMP/vindorvoice.keystore"
          ALIGNED="$RUNNER_TEMP/VindorVoice-aligned.apk"
          FINAL="$GITHUB_WORKSPACE/VindorVoice.apk"

          keytool -genkeypair \
            -noprompt \
            -keystore "$KEYSTORE" \
            -alias vindorvoice \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VindorVoice, OU=Mobile, O=VindorVoice, L=Cairo, S=Cairo, C=EG"

          "$BUILD_TOOLS/zipalign" \
            -f \
            -p \
            4 \
            "$UNSIGNED_APK" \
            "$ALIGNED"

          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias vindorvoice \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out "$FINAL" \
            "$ALIGNED"

          test -s "$FINAL"

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail

          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          unzip -tq VindorVoice.apk

          "$BUILD_TOOLS/apksigner" verify \
            --verbose \
            --min-sdk-version 23 \
            VindorVoice.apk

          "$BUILD_TOOLS/aapt" dump badging VindorVoice.apk \
            | tee "$RUNNER_TEMP/apk-badging.txt"

          grep -q "package: name='com.voicerooms.app'" \
            "$RUNNER_TEMP/apk-badging.txt"

          sha256sum VindorVoice.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VindorVoice-verified-${{ github.run_number }}
          path: VindorVoice.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "vindorvoice-${{ github.run_number }}"
          name: "VindorVoice ${{ github.run_number }} - Verified APK"
          files: VindorVoice.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
