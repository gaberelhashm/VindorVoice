      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: android
          SIGNING_KEY_PASSWORD: android
        run: |
          set -e

          keytool -genkeypair \
            -v \
            -keystore "$RUNNER_TEMP/release.keystore" \
            -alias vindorvoice \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "$SIGNING_STORE_PASSWORD" \
            -keypass "$SIGNING_KEY_PASSWORD" \
            -dname "CN=VindorVoice, OU=Mobile, O=VindorVoice, L=Cairo, S=Cairo, C=EG"

          ./gradlew clean assembleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$SIGNING_STORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="vindorvoice" \
            -Pandroid.injected.signing.key.password="$SIGNING_KEY_PASSWORD" \
            --stacktrace \
            --no-daemon

          APK="app/build/outputs/apk/release/app-release.apk"

          test -s "$APK"
          file "$APK"
          unzip -t "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/zipalign" -c -v 4 "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

          mkdir -p dist
          cp "$APK" dist/VindorVoice.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VindorVoice-installable
          path: dist/VindorVoice.apk
          if-no-files-found: error
          retention-days: 30
