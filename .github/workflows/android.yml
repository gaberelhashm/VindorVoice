name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and validate installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Install Android SDK command line tools
        shell: bash
        run: |
          set -euxo pipefail

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/commandlinetools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          unzip -q "$RUNNER_TEMP/commandlinetools.zip" \
            -d "$SDK/cmdline-tools"

          mv "$SDK/cmdline-tools/cmdline-tools" \
             "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

            - name: Accept Android SDK licenses
        shell: bash
        run: |
          set -eo pipefail
          yes | sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --licenses >/dev/null 2>&1 || true
      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euxo pipefail

          sdkmanager --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build APK
        shell: bash
        run: |
          set -euxo pipefail

          chmod +x ./gradlew

          ./gradlew clean assembleDebug \
            --no-daemon \
            --stacktrace

      - name: Verify APK
        shell: bash
        run: |
          set -euxo pipefail

          APK="app/build/outputs/apk/debug/app-debug.apk"
          BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"

          test -f "$APK"
          test -s "$APK"

          file "$APK"
          unzip -t "$APK" >/dev/null
          "$BUILD_TOOLS/zipalign" -c -v 4 "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose "$APK"

      - name: Prepare APK for download
        shell: bash
        run: |
          set -euxo pipefail

          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk \
             output/VindorVoice.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: VindorVoice-installable
          path: output/VindorVoice.apk
          if-no-files-found: error
          retention-days: 30
