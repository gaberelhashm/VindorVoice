name: Build Android APK

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build signed installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          SDK="$HOME/android-sdk"

          mkdir -p "$SDK/cmdline-tools"

          curl -fL \
            -o "$RUNNER_TEMP/cmdline-tools.zip" \
            "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"

          unzip -q "$RUNNER_TEMP/cmdline-tools.zip" \
            -d "$SDK/cmdline-tools"

          mv "$SDK/cmdline-tools/cmdline-tools" \
             "$SDK/cmdline-tools/latest"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"

      - name: Accept Android licenses
        shell: bash
        run: |
          yes | sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            --licenses >/dev/null 2>&1 || true

      - name: Install Android packages
        shell: bash
        run: |
          sdkmanager \
            --sdk_root="$ANDROID_SDK_ROOT" \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build release APK
        shell: bash
        run: |
          set -e

          chmod +x ./gradlew

          ./gradlew clean assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Sign release APK
        shell: bash
        run: |
          set -e

          KEYSTORE="$RUNNER_TEMP/vindorvoice.keystore"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          ALIGNED="$RUNNER_TEMP/VindorVoice-aligned.apk"
          FINAL="VindorVoice.apk"

          keytool -genkeypair \
            -v \
            -keystore "$KEYSTORE" \
            -alias vindorvoice \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=VindorVoice, OU=Mobile, O=VindorVoice, L=Cairo, S=Cairo, C=EG"

          test -s "$UNSIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/zipalign" \
            -f 4 \
            "$UNSIGNED" \
            "$ALIGNED"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias vindorvoice \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$FINAL" \
            "$ALIGNED"

          test -s "$FINAL"

          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify \
            --verbose \
            "$FINAL"

          file "$FINAL"

      - name: Upload final APK
        uses: actions/upload-artifact@v4
        with:
          name: VindorVoice-installable-release
          path: VindorVoice.apk
          if-no-files-found: error
          retention-days: 30
